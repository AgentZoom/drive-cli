[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-cli"
version = "0.1.0"
description = "Agent-facing CLI for the Drive Server API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.26",
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
drive-cli = "drive_cli.cli:app"

[tool.setuptools.packages.find]
include = ["drive_cli*"]
